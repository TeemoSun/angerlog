name: angerlog

services:
  db:
    image: postgres:15-alpine
    container_name: angerlog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请在 .env 中配置}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_bottle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-emotion_bottle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: pigzho/angerlog:latest
    build:
      context: .
    container_name: angerlog
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@db:5432/${POSTGRES_DB:-emotion_bottle}
      USERNAME: ${USERNAME:-admin}
      PASSWORD: ${PASSWORD:?PASSWORD 未设置，请在 .env 中配置}
      USER_TIMEZONE: ${USER_TIMEZONE:-Asia/Shanghai}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 未设置，请在 .env 中配置}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET 未设置，请在 .env 中配置}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/5minutes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - "8000:8000"

volumes:
  pgdata:
